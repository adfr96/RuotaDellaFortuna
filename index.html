        <style>
            body {
                padding-top: 60px;
                padding-bottom: 40px;
            }
        </style>
        <link rel="stylesheet" href="css/bootstrap-responsive.min.css">
        <link rel="stylesheet" href="css/main.css">

        <!--[if lt IE 9]>

    <body>
        <!--[if lt IE 7]>
            <p class="chromeframe">You are using an <strong>outdated</strong> browser. Please <a href="http://browsehappy.com/">upgrade your browser</a> or <a href="http://www.google.com/chromeframe/?redirect=true">activate Google Chrome Frame</a> to improve your experience.</p>

        <!-- This code is taken from http://twitter.github.com/bootstrap/examples/hero.html -->

        <div class="navbar navbar-inverse navbar-fixed-top">
            <div class="navbar-inner">
                <div class="container">
                    <a class="btn btn-navbar" data-toggle="collapse" data-target=".nav-collapse">
                        <span class="icon-bar"></span>
                        <span class="icon-bar"></span>
                        <span class="icon-bar"></span>
                    </a>
                    <a class="brand" href="#">Ruota della fortuna</a>
                    <div class="nav-collapse collapse">
                        <ul class="nav">
                            <li class="new-phrase input-large"><a href="#">Nuova Frase</a></li>
                        </ul>
                    </div><!--/.nav-collapse -->
                </div>
            </div>
        </div>

        <div class="container">

            <!-- Main hero unit for a primary marketing message or call to action -->
            <div class="hero-unit tabbellone">

            </div>

	<div class="theme-display">
		<span class="theme-label">TEMA: </span>
		<span class="theme-value">-</span>
	</div>

	 <div class="hero-unit">
		<span class="game"> </span><br>
		<span class="char-used"> </span>
		<div class="guess-section">
			<input type="text" class="guess-input" placeholder="Indovina la parola intera...">
			<button class="btn btn-primary guess-btn">Indovina!</button>
			<span class="guess-feedback"></span>
		</div>
            </div>

	<div class="hero-unit themes-section">
		<h4>Scegli un tema:</h4>
		<div class="themes-list" id="themesList">
		</div>
	</div>
        </div> <!-- /container -->
	
	<div class="confetti" id="confetti"></div>

	<!-- Audio di sottofondo -->
	<audio id="bg-music" src="sounds/Soundtrack_routa.mp3" loop></audio>

	<!-- Effetti sonori -->
	<audio id="success-sound" src="sounds/success_letter.mp3"></audio>
	<audio id="error-sound" src="sounds/letter_error_sound.mp3"></audio>
	<audio id="applause-sound" src="sounds/applause.mp3"></audio>

	<!-- Controllo audio fluttuante con regolazione volume -->
	<div class="music-control-container" id="musicControlContainer">
		<div class="volume-slider-container">
			<input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="0.5" title="Regola Volume" aria-label="Regola Volume">
		</div>
		<button class="music-control-btn" id="musicControlBtn" title="Attiva/Disattiva Musica" aria-label="Attiva/Disattiva Musica">
			<svg class="music-icon play-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
				<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
				<path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
			</svg>
			<svg class="music-icon mute-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
				<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
				<line x1="23" y1="9" x2="17" y2="15"></line>
				<line x1="17" y1="9" x2="23" y2="15"></line>
			</svg>
			<span class="music-waves">
				<span class="wave-bar bar-1"></span>
				<span class="wave-bar bar-2"></span>
				<span class="wave-bar bar-3"></span>
				<span class="wave-bar bar-4"></span>
			</span>
		</button>
	</div>

<div id="phrase" class="modal hide fade" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
<div class="modal-header">
<button type="button" class="close" data-dismiss="modal" aria-hidden="true">×</button>
<h3 id="myModalLabel">Inserisci una nuova frase</h3>
</div>
<div class="modal-body">
<div class="phrase-creator">
	<label>Nuova frase:</label>
	<div class="input-group">
		<input type="text" placeholder="Inserisci la frase" class="parse-me">
	</div>
	<label>Tema:</label>
	<div class="input-group">
		<input type="text" placeholder="Es: Film, Canzoni, Persone..." class="phrase-theme">
	</div>
</div>
</div>
<div class="modal-footer">
<button class="btn" data-dismiss="modal" aria-hidden="true">Annulla</button>
<button class="btn btn-primary go">Gioca!</button>
</div>
</div>
        <script src="//ajax.googleapis.com/ajax/libs/jquery/1.9.0/jquery.min.js"></script>
        <script>window.jQuery || document.write('<script src="js/vendor/jquery-1.9.0.min.js"><\/script>')</script>

        <script src="js/vendor/bootstrap.min.js"></script>

        <script src="js/phrases.js"></script>
        <script src="js/main.js"></script>
    </body>
</html>
